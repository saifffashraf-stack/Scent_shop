<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأدمن | Scent_shop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="container header-inner">
            <a href="index.html" class="brand-logo">
                Scent_shop
                <span>ADMIN PANEL</span>
            </a>
            <a href="index.html" class="btn-outline-pill">← العودة للمتجر</a>
        </div>
    </header>

    <main class="container" style="padding: 40px 20px;">
        <h2 class="section-title">إدارة المنتجات والطلبات</h2>

        <section style="margin-bottom: 50px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>المنتجات المعروضة ومعلومات الناشر</h3>
            </div>
            <div id="adminProductsGrid" class="products-grid"></div>
        </section>

        <section>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>طلبات العملاء (السلة)</h3>
                <button onclick="clearOrders()" class="btn-pink" style="background:#e74c3c; padding:6px 14px; font-size:0.8rem;">مسح كل الطلبات القديمة</button>
            </div>
            <div id="adminOrdersList" class="orders-container"></div>
        </section>
    </main>

    <script>
        function renderAdminData() {
            let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
            let orders = JSON.parse(localStorage.getItem('storeOrders')) || [];

            const pGrid = document.getElementById('adminProductsGrid');
            pGrid.innerHTML = '';
            if(products.length === 0) {
                pGrid.innerHTML = '<p>لا توجد منتجات مسجلة.</p>';
            } else {
                products.forEach((p, idx) => {
                    const card = document.createElement('div');
                    card.className = 'store-card';
                    card.innerHTML = `
                        <div class="store-card-img">
                            <img src="${p.image}" alt="">
                        </div>
                        <div class="store-card-info">
                            <h3>${p.name}</h3>
                            <div class="card-price">LE ${p.price}</div>
                            <div class="admin-seller-box">
                                <img src="${p.seller.avatar}" alt="">
                                <div>
                                    <strong>${p.seller.name}</strong>
                                    <span>${p.seller.email}</span>
                                </div>
                            </div>
                            <button onclick="deleteProduct(${idx})" class="btn-pink full-width" style="background:#e74c3c; margin-top:10px;">حذف المنتج</button>
                        </div>
                    `;
                    pGrid.appendChild(card);
                });
            }

            const oList = document.getElementById('adminOrdersList');
            oList.innerHTML = '';
            if(orders.length === 0) {
                oList.innerHTML = '<p>لا توجد طلبات جديدة.</p>';
            } else {
                orders.forEach(ord => {
                    const box = document.createElement('div');
                    box.className = 'order-card-admin';
                    let itemsHtml = ord.items.map(i => `<li>${i.name} - الكمية: ${i.qty} - السعر: ${i.price * i.qty} EGP</li>`).join('');
                    
                    const bName = ord.buyerName || ord.name || 'عميل غير معروف';
                    const bPhone = ord.buyerPhone || ord.phone || 'غير متوفر';
                    const bEmail = ord.buyerEmail || ord.email || 'غير متوفر';
                    const bDate = ord.date || 'وقت غير محدد';

                    box.innerHTML = `
                        <div class="order-admin-header" style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
                            <h2 style="font-size: 1.7rem; font-weight: 900; color: var(--black);">${bName}</h2>
                            <p style="font-size: 1.1rem; font-weight: 800; color: var(--pink-main);">رقم الهاتف: ${bPhone}</p>
                            <p style="font-size: 0.85rem; color: var(--gray-text);">البريد الإلكتروني: ${bEmail}</p>
                            <span style="font-size: 0.75rem; color: #888;">وقت الطلب: ${bDate}</span>
                        </div>
                        <h4 style="margin: 14px 0 6px 0; font-size: 0.95rem; font-weight: 800;">المنتجات المطلوبة (الأوردر):</h4>
                        <ul class="order-items-list">${itemsHtml}</ul>
                        <div class="order-total-bar" style="margin-top: 10px;">إجمالي الطلب: <strong>${ord.total} EGP</strong></div>
                    `;
                    oList.appendChild(box);
                });
            }
        }

        window.deleteProduct = function(idx) {
            let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
            products.splice(idx, 1);
            localStorage.setItem('storeProducts', JSON.stringify(products));
            renderAdminData();
        }

        window.clearOrders = function() {
            if(confirm('هل أنت متأكد من مسح جميع الطلبات القديمة؟')) {
                localStorage.removeItem('storeOrders');
                renderAdminData();
            }
        }

        renderAdminData();
    </script>
</body>
</html>
