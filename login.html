<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Scent_shop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="announcement-bar">
        <div class="marquee-track">
            <span>أهلاً بيك في Scent_shop <i class="dot">◆</i></span>
            <span>تسجيل الدخول لحسابك <i class="dot">◆</i></span>
        </div>
    </div>

    <header class="main-header">
        <div class="container header-inner">
            <a href="index.html" class="brand-logo">
                Scent_shop
                <span>FEELS LIKE YOU</span>
            </a>
            <a href="index.html" class="btn-outline-pill">← الرجوع للمتجر</a>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <span class="mini-label">تسجيل الدخول</span>
            <h2 style="font-size: 1.5rem; margin-bottom: 22px;">سجل دخولك لحسابك لإدارة منتجاتك بسهولة.</h2>

            <button type="button" id="googleLoginBtn" class="btn-google full-width">
                <span>G</span> تسجيل الدخول بواسطة جوجل
            </button>

            <div class="divider">أو عبر البريد الإلكتروني</div>

            <form id="loginForm">
                <div class="input-group">
                    <label>حساب الجيميل (Gmail) *</label>
                    <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
                </div>

                <div class="input-group">
                    <label>كلمة المرور (الباسورد) *</label>
                    <input type="password" id="loginPassword" placeholder="اكتب كلمة المرور" required>
                </div>

                <button type="submit" class="btn-pink full-width">تسجيل الدخول</button>
            </form>

            <p class="auth-footer-text">ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a></p>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            let users = JSON.parse(localStorage.getItem('storeUsers')) || [];
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('storeUser', JSON.stringify(user));
                alert('تم تسجيل الدخول بنجاح!');
                window.location.href = 'index.html';
            } else {
                alert('البريد الإلكتروني أو كلمة المرور غير صحيحة.');
            }
        });

        document.getElementById('googleLoginBtn').addEventListener('click', function() {
            const email = prompt('أدخل إيميل جوجل الخاص بك:');
            if (!email) return;
            const name = prompt('أدخل اسمك الحقيقي:');
            if (!name) return;
            const avatar = prompt('أدخل رابط صورتك الشخصية (أو اتركها فارغة لتلقائي):') || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=ff477e&color=fff`;

            let users = JSON.parse(localStorage.getItem('storeUsers')) || [];
            let existingUser = users.find(u => u.email === email);

            if (!existingUser) {
                existingUser = { name, email, password: '', avatar };
                users.push(existingUser);
                localStorage.setItem('storeUsers', JSON.stringify(users));
            }

            localStorage.setItem('storeUser', JSON.stringify(existingUser));
            alert('تم تسجيل الدخول بواسطة جوجل بنجاح!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
